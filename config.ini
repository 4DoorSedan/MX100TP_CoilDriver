[instruments]
# Set virtual_mode = true to use the built-in 330F RC physics simulator without hardware.
# Set virtual_mode = false to communicate with physical instruments over Ethernet SCPI.
virtual_mode = true
psu_ip = 192.168.1.100
psu_port = 9221
psu_channel = 1
dmm_ip = 192.168.1.101
dmm_port = 5025
socket_timeout_s = 2.0

[safety]
# Hard safety limits strictly enforced by both controller validation and PSU drivers.
max_voltage_v = 35.0
max_current_a = 3.0

[conversion]
# Amperes per nanoTesla conversion rate: I_coil (A) = B_field (nT) * a_per_nt
a_per_nt = 0.0001

[pid]
# Anti-overshoot PID parameters tuned for the 330 F capacitor + solenoid load.
kp = 18.0
ki = 0.35
kd = 25.0
holding_tolerance_ratio = 0.01
control_interval_s = 0.1
# Maximum overdrive voltage above estimated steady-state capacitor voltage to prevent overshoot
max_overdrive_v = 2.5

[circuit_model]
# Circuit component parameters from "External Documentation/Circuit Diagram.jpg"
# Used by the Virtual Testing Mode physics simulator and PID feedforward estimator.
capacitance_f = 330.0
load_resistance_ohm = 10.0
bleeder_resistance_ohm = 100.0
source_resistance_ohm = 0.5

[logging]
enabled = true
log_interval_s = 1.0
log_file_path = logs/coil_driver_log.csv
