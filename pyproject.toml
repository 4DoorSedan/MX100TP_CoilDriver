[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mx100tp-coil-driver"
version = "0.1.0"
description = "Solenoid magnetic field controller using TTi MX100TP power supply and Keysight 34461A multimeter over SCPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
